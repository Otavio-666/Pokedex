<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Logo.png">

</head>
<body>

    <header>
        <div class="logo">
            <img src="Logo.png" alt="Logo do Pokémon">
        <h1>Pokedex</h1>
        </div>
    </header>

    <form id="nome-pesquisa">
        <input type="text" id="nome" placeholder="Digite o nome do Pokémon">
        <button type="submit">Pesquisar</button>
        <button type="button" id="aleatorio">Aleatório</button>
    </form>

    <section id="resultado">
        <!-- Resultado da pesquisa será exibido aqui -->
    </section>
    <button id="shiny">Pesquisar Pokémon Shiny</button>
    
    <section id="historico">
        <h2>Histórico de Pesquisas</h2>
        <button id="limpar-historico">Limpar Histórico</button>
        <div id="historico-container">
            <ul id="lista-historico">
                <!-- Histórico de pesquisas será exibido aqui -->
            </ul>
        </div>
    </section>

</body>
</html>
