<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/International_Pok%C3%A9mon_logo.svg/2560px-International_Pok%C3%A9mon_logo.svg.png" alt="Logo do Pokémon">
        <h1>Pokedex</h1>
        </div>
    </header>

    <form id="nome-pesquisa">
        <input type="text" id="nome" placeholder="Digite o nome do Pokémon">
        <button type="submit">Pesquisar</button>
    </form>

    <section id="resultado">
        <!-- Resultado da pesquisa será exibido aqui -->
    </section>

    <section id="historico">
        <h2>Histórico de Pesquisas</h2>
        <div id="historico-container">
            <ul id="lista-historico">
                <!-- Histórico de pesquisas será exibido aqui -->
            </ul>
        </div>
    </section>

</body>
</html>
